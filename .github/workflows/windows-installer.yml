name: Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del release (ej. 0.1.0). Se publicará como v<versión>."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Compilar instalador NSIS
        working-directory: crates/nexus-desktop
        run: cargo tauri build --bundles nsis --no-sign

      - name: Subir instalador como artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-windows-x64-setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: NEXUS ${{ github.event.inputs.version || github.ref_name }}
          files: target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Instalador de Windows (x64), sin firmar.

            Descarga `NEXUS_*_x64-setup.exe` y ejecútalo. Si Windows muestra SmartScreen: **Más información** → **Ejecutar de todos modos**.

            No incluye credenciales de IA; configura tu proveedor desde Ajustes.
